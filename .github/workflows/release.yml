name: Build and Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v'
        required: true
      publish:
        description: 'Publish the three verified downloads'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          "value=$v" >> $env:GITHUB_OUTPUT
      - uses: microsoft/setup-msbuild@v2
      - name: Publish fully self-contained app
        shell: pwsh
        run: |
          msbuild FluentLegionToolbar.csproj /restore /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:WindowsAppSDKSelfContained=true /p:WindowsAppSdkBootstrapInitialize=false /p:DebugType=none /p:Version=${{ steps.version.outputs.value }} /p:PublishDir="$PWD/publish/"
          if ($LASTEXITCODE -ne 0) { throw 'App publish failed' }
          $buildDir = Join-Path $PWD 'bin/x64/Release/net8.0-windows10.0.19041.0/win-x64'
          Get-ChildItem $buildDir -Recurse -Include *.xbf,*.pri | ForEach-Object {
            $relative = $_.FullName.Substring($buildDir.Length+1)
            $destination = Join-Path (Join-Path $PWD 'publish') $relative
            New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
            Copy-Item $_.FullName $destination -Force
          }
          if (-not (Test-Path publish/MainWindow.xbf)) { throw 'Compiled XAML missing' }
          # Ship Microsoft's app-local VC runtime rather than installing a machine-wide redistributable.
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'Microsoft app-local VC runtime not found' }
          Copy-Item "$($crt.FullName)/*.dll" publish -Force
      - name: Verify local dependencies and remove shared Windows App Runtime from test runner
        shell: pwsh
        run: |
          $config = Get-Content publish/FluentLegionToolbar.runtimeconfig.json -Raw | ConvertFrom-Json
          if ($config.runtimeOptions.framework -or $config.runtimeOptions.frameworks) { throw 'Still depends on shared .NET' }
          foreach ($file in @('FluentLegionToolbar.exe','Microsoft.WinUI.dll','Microsoft.WindowsAppRuntime.dll','coreclr.dll','hostfxr.dll','vcruntime140.dll','msvcp140.dll')) {
            if (-not (Test-Path "publish/$file")) { throw "Missing bundled dependency: $file" }
          }
          Import-Module Appx -UseWindowsPowerShell
          Get-AppxPackage '*WindowsAppRuntime*' | Remove-AppxPackage -ErrorAction Stop
          if (Get-AppxPackage '*WindowsAppRuntime*') { throw 'Shared Windows App Runtime remains installed for runner user' }
          $env:DOTNET_MULTILEVEL_LOOKUP = '0'
          $env:DOTNET_ROOT = "$env:RUNNER_TEMP/no-shared-dotnet"
          New-Item -ItemType Directory -Force $env:DOTNET_ROOT | Out-Null
          $p = Start-Process "$PWD/publish/FluentLegionToolbar.exe" -ArgumentList '--no-elevate','--show' -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Get-Content publish/launch-error.txt -ErrorAction SilentlyContinue; throw "Bundled launch failed: $($p.ExitCode)" }
          $local = (Resolve-Path publish).Path
          $modules = @($p.Modules | Where-Object { $_.ModuleName -match '^(coreclr|Microsoft.WinUI|Microsoft.WindowsAppRuntime|hostfxr)\.dll$' })
          foreach ($name in @('coreclr.dll','Microsoft.WinUI.dll','Microsoft.WindowsAppRuntime.dll')) {
            $module = $modules | Where-Object ModuleName -eq $name
            if (-not $module -or -not $module.FileName.StartsWith($local, [StringComparison]::OrdinalIgnoreCase)) { throw "Dependency not loaded locally: $name" }
          }
          $modules | Select-Object ModuleName,FileName | ConvertTo-Json | Set-Content dependency-proof.json
          Add-Type -AssemblyName System.Drawing,System.Windows.Forms
          Add-Type -AssemblyName System.Drawing,System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
          $bitmap.Save("$PWD/app-launch.png")
          $graphics.Dispose(); $bitmap.Dispose()
          Stop-Process -Id $p.Id -Force
      - name: Package portable archive and per-user installer
        shell: pwsh
        run: |
          @'
          FluentLegionToolbar ${{ steps.version.outputs.value }} - x64
          Windows 10 version 1809 or later / Windows 11 (x64).
          Extract the entire ZIP before running FluentLegionToolbar.exe. Keep all files together.
          .NET, Windows App SDK, and VC runtime files are bundled. No runtime installation is required.
          The installer installs for the current user without administrator rights.
          Portable ZIP and installer include the same bundled dependencies.
          brought to you by Instinct - https://instinct.com
          '@ | Set-Content publish/README.txt -Encoding utf8
          Copy-Item LICENSE publish/LICENSE.txt
          Compress-Archive -Path publish/* -DestinationPath 'FluentVantageToolbar-v${{ steps.version.outputs.value }}-portable-win-x64.zip'
          (Get-Content installer.iss) -replace '#define AppVersion ".*"', '#define AppVersion "${{ steps.version.outputs.value }}"' | Set-Content installer.iss
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" /DSourceDir=publish /DOutName=FluentVantageToolbar-v${{ steps.version.outputs.value }}-installer-win-x64 /DBundled=1 installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          Copy-Item installers/*.exe .
      - name: Verify installer extraction and installed launch
        shell: pwsh
        run: |
          $p = Start-Process './FluentVantageToolbar-v${{ steps.version.outputs.value }}-installer-win-x64.exe' -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $root = "$env:ProgramFiles/FluentLegionToolbar"
          if (-not (Test-Path "$root/FluentLegionToolbar.exe")) { throw 'Per-user install missing' }
          $desktop = [Environment]::GetFolderPath('CommonDesktopDirectory')
          $programs = [Environment]::GetFolderPath('CommonPrograms')
          foreach ($dir in @($desktop,$programs)) {
            if (-not (Test-Path "$dir/Fluent Vantage Toolbar.lnk")) { throw 'Clean shortcut missing' }
            if (Test-Path "$dir/Fluent Vantage Toolbar (Self-contained).lnk") { throw 'Old shortcut remains' }
          }
          $p = Start-Process "$root/FluentLegionToolbar.exe" -ArgumentList '--no-elevate','--show' -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "Installed launch failed: $($p.ExitCode)" }
          Add-Type -AssemblyName System.Drawing,System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
          $bitmap.Save("$PWD/installed-launch.png")
          $graphics.Dispose(); $bitmap.Dispose()
          Stop-Process -Id $p.Id -Force
      - name: Build full offline kit with signed Microsoft installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force offline/runtimes | Out-Null
          Copy-Item 'FluentVantageToolbar-v${{ steps.version.outputs.value }}-installer-win-x64.exe' offline/Install.exe
          $downloads = @(
            @{ url='https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/8.0.31/windowsdesktop-runtime-8.0.31-win-x64.exe'; name='windowsdesktop-runtime-x64.exe'; sha512='605189223cf0a64bfb5453520b794d1d386a97c7e65e3944feaf9214db1a8b247f66c569265aef4204447baf5b5ff19559c323d887e1318f17deb28a5af0fa12' },
            @{ url='https://aka.ms/windowsappsdk/1.6/1.6.250602001/windowsappruntimeinstall-x64.exe'; name='windowsappruntimeinstall-x64.exe'; sha512='' },
            @{ url='https://aka.ms/vc14/vc_redist.x64.exe'; name='vc_redist.x64.exe'; sha512='' }
          )
          foreach ($file in $downloads) {
            $path = "offline/runtimes/$($file.name)"
            Invoke-WebRequest $file.url -OutFile $path
            $sig = Get-AuthenticodeSignature $path
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw "Invalid Microsoft signature: $path" }
            if ($file.sha512 -and (Get-FileHash $path -Algorithm SHA512).Hash -ne $file.sha512) { throw '.NET checksum mismatch' }
          }
          @'
          Full offline kit
          Run Install.exe to install the app without internet.
          Administrator rights are required for toolbar installation and hardware/startup features.
          The app includes .NET, Windows App SDK and VC runtime files. No separate runtime installation is required.
          The runtimes folder additionally contains the original signed Microsoft offline installers for .NET Desktop Runtime 8, Windows App Runtime 1.6 and Visual C++ x64.
          These optional system installers can require administrator rights. They are not needed to run this app.
          '@ | Set-Content offline/README.txt -Encoding utf8
          Get-ChildItem offline -Recurse -File | Get-FileHash -Algorithm SHA256 | Select-Object Path,Hash | ConvertTo-Json | Set-Content offline/SHA256.json
          Compress-Archive offline/* 'FluentVantageToolbar-v${{ steps.version.outputs.value }}-full-offline-win-x64.zip'
          Expand-Archive 'FluentVantageToolbar-v${{ steps.version.outputs.value }}-full-offline-win-x64.zip' offline-test
          $test = Start-Process './offline-test/Install.exe' -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw 'Offline kit install failed' }
          $app = Start-Process "$env:ProgramFiles/FluentLegionToolbar/FluentLegionToolbar.exe" -ArgumentList '--no-elevate','--show' -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw 'Offline kit app launch failed' }
          Stop-Process -Id $app.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: verified-downloads
          path: |
            FluentVantageToolbar-v${{ steps.version.outputs.value }}-*.zip
            FluentVantageToolbar-v${{ steps.version.outputs.value }}-*.exe
            app-launch.png
            dependency-proof.json
            installed-launch.png
      - name: Add new assets without replacing old downloads
        if: github.event_name == 'push' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v${{ steps.version.outputs.value }} --json tagName | Out-Null
          if ($LASTEXITCODE -ne 0) { gh release create v${{ steps.version.outputs.value }} --draft --title 'v${{ steps.version.outputs.value }}' --notes-file CHANGELOG.md }
          gh release upload v${{ steps.version.outputs.value }} './FluentVantageToolbar-v${{ steps.version.outputs.value }}-portable-win-x64.zip' './FluentVantageToolbar-v${{ steps.version.outputs.value }}-installer-win-x64.exe' './FluentVantageToolbar-v${{ steps.version.outputs.value }}-full-offline-win-x64.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed; existing assets were not replaced' }
          if ('${{ steps.version.outputs.value }}' -eq '0.4.0') {
            Copy-Item './FluentVantageToolbar-v${{ steps.version.outputs.value }}-installer-win-x64.exe' './FluentVantageToolbar-${{ steps.version.outputs.value }}-Setup-with-dotnet.exe'
            gh release upload v${{ steps.version.outputs.value }} './FluentVantageToolbar-${{ steps.version.outputs.value }}-Setup-with-dotnet.exe'
            if ($LASTEXITCODE -ne 0) { throw 'Legacy bridge upload failed' }
          }
          gh release view v${{ steps.version.outputs.value }} --json body --jq .body > release-notes.md
          $body = Get-Content release-notes.md -Raw
          $body = $body.Replace('Self-contained downloads','Downloads').Replace('self-contained', 'bundled-runtime').Replace('Self-contained', 'Bundled-runtime')
          $body | Set-Content release-notes.md -Encoding utf8
          gh release edit v${{ steps.version.outputs.value }} --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Notes update failed' }
          gh release view v${{ steps.version.outputs.value }} --json assets > assets.json
          $assets = (Get-Content assets.json -Raw | ConvertFrom-Json).assets
          foreach ($name in @('FluentVantageToolbar-v${{ steps.version.outputs.value }}-portable-win-x64.zip','FluentVantageToolbar-v${{ steps.version.outputs.value }}-installer-win-x64.exe','FluentVantageToolbar-v${{ steps.version.outputs.value }}-full-offline-win-x64.zip')) {
            if (-not ($assets | Where-Object { $_.name -eq $name -and $_.size -gt 1000000 })) { throw "Missing replacement $name" }
          }

